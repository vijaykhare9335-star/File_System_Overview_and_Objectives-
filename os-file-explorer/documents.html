<script>
'use strict';
/* ================= Config ================= */
const CAP = 200 * 1024 * 1024, BLOCK = 4096, N_CELLS = 200;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];

const SEARCHABLE = ['explorer','recent','documents','images','trash'], SORTABLE = ['explorer','documents','trash'];

/* ================= Icons (inline SVG) ================= */
const ICON = {
 book:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',

 folderplus:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>',
 trash:'<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/>',

 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',

 download:'<path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/>',

 x:'<path d="M6 6l12 12M18 6L6 18"/>', check:'<path d="M5 12l5 5 9-10"/>',
 up:'<path d="M12 19V5M6 11l6-6 6 6"/>', chevR:'<path d="M9 6l6 6-6 6"/>', chevL:'<path d="M15 6l-6 6 6 6"/>', chevU:'<path d="M6 15l6-6 6 6"/>', chevD:'<path d="M6 9l6 6 6-6"/>',
 arrowR:'<path d="M5 12h14M13 6l6 6-6 6"/>',

 sort:'<path d="M7 4v16"/><path d="M3 16l4 4 4-4"/><path d="M17 20V4"/><path d="M13 8l4-4 4 4"/>',
 panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>', menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
 monitor:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
 tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
 zap:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
 users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14c2.5 0 4 2 4 5"/>',
 layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
 play:'<path d="M7 4l13 8-13 8z"/>', pause:'<path d="M8 5v14M16 5v14"/>',
 zoomin:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/>', zoomout:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M8 11h6"/>'
};
const ic = (n, c = '') => `<svg class="i ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n] || ''}</svg>`;
const hydrate = () => $$('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic, el.className); });

/* ================= Helpers ================= */
const PREF = Object.assign({view:'icons', sort:'name', dir:1, group:'none', pane:true, gal:170}, JSON.parse(localStorage.getItem('prefs') || '{}'));
const savePrefs = () => localStorage.setItem('prefs', JSON.stringify(PREF));
const S = {page: document.body.dataset.page, all: [], map: new Map(), q: '', sel: new Set(), anchor: null, cwd: localStorage.getItem('cwd') || null, starOnly: false, chip: 'all', sort: {key:'name', dir:1}, count: 0, imgs: []};
const DEFSORT = {explorer:{key:PREF.sort, dir:PREF.dir}, documents:{key:'modified', dir:-1}, images:{key:'modified', dir:-1}, trash:{key:'deletedAt', dir:-1}};
if (DEFSORT[S.page]) S.sort = {...DEFSORT[S.page]};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const isDir = f => f.kind === 'folder', par = f => (f && f.parent) || null;
const extOf = n => n.includes('.') ? n.split('.').pop().toLowerCase() : '';
const cat = f => isDir(f) ? 'folder' : IMG.includes(extOf(f.name)) ? 'image' : DOC.includes(extOf(f.name)) ? 'doc' : 'other';
const typeName = f => isDir(f) ? 'File folder' : TYPES[extOf(f.name)] || (extOf(f.name) ? extOf(f.name).toUpperCase() + ' File' : 'File');
const fmtSize = b => { if (b < 1024) return b + ' B'; const u = ['KB','MB','GB']; let i = -1; do { b /= 1024; i++; } while (b >= 1024 && i < 2); return b.toFixed(b < 10 ? 2 : 1) + ' ' + u[i]; };
const fmtDate = t => t ? new Date(t).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : '—';
const rel = t => { const s = (Date.now() - t) / 1000; return s < 60 ? 'Just now' : s < 3600 ? Math.floor(s / 60) + ' min ago' : s < 86400 ? Math.floor(s / 3600) + ' hr ago' : s < 172800 ? 'Yesterday' : Math.floor(s / 86400) + ' days ago'; };
const dayGroup = t => { const sod = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(), d = Math.round((sod(new Date()) - sod(new Date(t))) / 864e5); return d <= 0 ? 'Today' : d === 1 ? 'Yesterday' : d < 7 ? 'Earlier this week' : d < 31 ? 'Earlier this month' : 'Older'; };
const live = () => S.all.filter(r => !r.deleted), files = () => live().filter(r => !isDir(r));
const usage = () => S.all.reduce((a, r) => a + (r.size || 0), 0);
const kids = pid => live().filter(r => par(r) === pid);
const match = l => l.filter(f => f.name.toLowerCase().includes(S.q));
const selItems = () => [...S.sel].map(id => S.map.get(id)).filter(Boolean);
const gsize = f => isDir(f) ? S.all.filter(r => r.batch === f.id).reduce((a, r) => a + r.size, 0) : f.size;
const pathOf = f => { const p = []; let c = S.map.get(par(f)); while (c) { p.unshift(c.name); c = S.map.get(par(c)); } return 'This PC' + (p.length ? '\\' + p.join('\\') : ''); };
function subtree(id) { const out = [], q = [id]; while (q.length) { const x = q.pop(); for (const r of S.all) if (!r.deleted && par(r) === x) { out.push(r); q.push(r.id); } } return out; }
function uniqueName(name, parent, skip) {
  const taken = new Set(live().filter(f => par(f) === parent && f.id !== skip).map(f => f.name.toLowerCase()));
  if (!taken.has(name.toLowerCase())) return name;
  const i = name.lastIndexOf('.'), b = i > 0 ? name.slice(0, i) : name, e = i > 0 ? name.slice(i) : '';
  let n = 1; while (taken.has(`${b} (${n})${e}`.toLowerCase())) n++;
  return `${b} (${n})${e}`;
}
const urls = {}, url = f => urls[f.id] || (urls[f.id] = URL.createObjectURL(f.blob));
const dims = b => new Promise(res => { const i = new Image(), u = URL.createObjectURL(b); i.onload = () => { res([i.naturalWidth, i.naturalHeight]); URL.revokeObjectURL(u); }; i.onerror = () => { res([0, 0]); URL.revokeObjectURL(u); }; i.src = u; });

/* file & folder icons */
function fileIcon(f, cls = '') {
  if (isDir(f)) return `<svg class="fi dir ${cls}" viewBox="0 0 56 48" aria-hidden="true"><path d="M3 8a3 3 0 0 1 3-3h13l5 5h26a3 3 0 0 1 3 3v27a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z" fill="#e8a81a"/><path d="M3 17a3 3 0 0 1 3-3h44a3 3 0 0 1 3 3v22a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z" fill="#ffd45c"/></svg>`;
  if (cat(f) === 'image') return `<img class="fi thumb ${cls}" src="${url(f)}" alt="">`;
  const e = extOf(f.name), c = EXTCOL[e] || '#64748b', t = (e || 'file').slice(0, 4).toUpperCase();
  return `<svg class="fi ${cls}" viewBox="0 0 48 56" aria-hidden="true"><path d="M6 2h26l12 12v38a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#fff" stroke="#c3ccd9" stroke-width="2"/><path d="M32 2v12h12" fill="#e8edf5" stroke="#c3ccd9" stroke-width="2" stroke-linejoin="round"/><rect x="2" y="27" width="34" height="15" rx="2" fill="${c}"/><text x="19" y="38" font-size="${t.length > 3 ? 8 : 9.5}" font-weight="700" fill="#fff" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">${esc(t)}</text></svg>`;
}

/* ================= IndexedDB ================= */
let db;
const openDB = () => new Promise((res, rej) => { const r = indexedDB.open('os_filesystem_demo', 1); r.onupgradeneeded = () => r.result.createObjectStore('files', {keyPath:'id'}); r.onsuccess = () => { db = r.result; res(); }; r.onerror = () => rej(r.error); });
const store = m => db.transaction('files', m).objectStore('files');
const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const getAll = () => rq(store('readonly').getAll()), put = f => rq(store('readwrite').put(f)), del = id => rq(store('readwrite').delete(id));

/* ================= File operations ================= */
async function addFiles(list, parent) {
  list = [...list]; if (!list.length) return;
  if (parent === undefined) parent = S.page === 'explorer' ? S.cwd : null;
  let used = usage(), n = 0, skipped = 0;
  for (const file of list) {
    if (used + file.size > CAP) { skipped++; continue; }
    const now = Date.now();
    const f = {id: uid(), kind:'file', parent, name: uniqueName(file.name, parent), size: file.size, mime: file.type || '', created: now, modified: file.lastModified || now, accessed: now, deleted: false, deletedAt: null, star: false, blob: file};
    if (IMG.includes(extOf(file.name))) [f.w, f.h] = await dims(file);
    await put(f); S.all.push(f); S.map.set(f.id, f); used += file.size; n++;
  }
  toast(`${n} file${n === 1 ? '' : 's'} added` + (skipped ? `, ${skipped} skipped (virtual disk full)` : ''));
  await refresh();
}
function pick(accept) { const i = document.createElement('input'); i.type = 'file'; i.multiple = true; if (accept) i.accept = accept; i.onchange = () => addFiles(i.files); i.click(); }
function download(f) { if (isDir(f)) return; const a = document.createElement('a'); a.href = url(f); a.download = f.name; a.click(); }
async function rename(f) {
  const n = await ask({title: isDir(f) ? 'Rename folder' : 'Rename file', input: 1, value: f.name, ok: 'Rename'}); if (n == null) return;
  const v = n.trim();
  if (!v || /[\\/:*?"<>|]/.test(v)) return toast('Invalid name. Avoid \\ / : * ? " < > |');
  if (v === f.name) return;
  if (uniqueName(v, par(f), f.id) !== v) return toast('An item with that name already exists here');
  f.name = v; f.modified = f.accessed = Date.now(); await put(f); toast('Renamed to ' + v); await refresh();
}
async function trashItems(items) {
  const tops = [], now = Date.now();
  for (const t of items) { if (t.deleted) continue; for (const r of [t, ...subtree(t.id)]) { r.deleted = true; r.deletedAt = now; r.batch = t.id; await put(r); } tops.push(t); }
  if (!tops.length) return;
  S.sel.clear();
  toast(`Moved ${tops.length} item${tops.length === 1 ? '' : 's'} to the Recycle Bin`, 'Undo', async () => { for (const t of tops) await restoreOne(t); await refresh(); });
  await refresh();
}
async function restoreOne(top) {
  const grp = S.all.filter(r => r.deleted && (r.batch === top.id || r.id === top.id)), p = S.map.get(par(top));
  if (!p || p.deleted) top.parent = null;
  top.name = uniqueName(top.name, par(top), top.id);
  for (const r of grp) { r.deleted = false; r.deletedAt = null; delete r.batch; if (r === top) r.accessed = Date.now(); await put(r); }
}
async function purgeOne(top) {
  for (const r of S.all.filter(r => r.deleted && (r.batch === top.id || r.id === top.id))) { await del(r.id); if (urls[r.id]) { URL.revokeObjectURL(urls[r.id]); delete urls[r.id]; } }
}
const binTops = () => S.all.filter(r => r.deleted && (!r.batch || r.batch === r.id));
async function moveTo(ids, target) {
  let n = 0;
  for (const id of ids) {
    const f = S.map.get(id); if (!f || f.deleted || id === target || par(f) === target) continue;
    let c = target, bad = false; while (c) { if (c === id) { bad = true; break; } c = par(S.map.get(c)); }
    if (bad) continue;
    f.parent = target; f.name = uniqueName(f.name, target, f.id); f.modified = Date.now(); await put(f); n++;
  }
  S.sel.clear(); toast(n ? `Moved ${n} item${n === 1 ? '' : 's'}` : 'Nothing was moved'); await refresh();
}
async function openItem(f) {
  if (isDir(f)) {
    if (S.page !== 'explorer') { localStorage.setItem('cwd', f.id); location.href = 'explorer.html'; return; }
    return goto(f.id);
  }
  f.accessed = Date.now(); await put(f); await refresh();
  if (cat(f) === 'image') { const l = S.page === 'images' && S.imgs.length ? S.imgs : files().filter(x => cat(x) === 'image'); return lightbox(l, Math.max(0, l.findIndex(x => x.id === f.id))); }
  return preview(f);
}
function goto(id) { S.cwd = id; id ? localStorage.setItem('cwd', id) : localStorage.removeItem('cwd'); S.sel.clear(); S.q = ''; $('#q').value = ''; render(); }
async function preview(f) {
  const e = extOf(f.name); let body;
  if (e === 'pdf') body = `<iframe class="pvx" src="${url(f)}"></iframe>`;
  else if (TXT.includes(e) || f.mime.startsWith('text/')) body = `<pre class="pvx">${esc((await f.blob.text()).slice(0, 20000))}</pre>`;
  else body = `<div class="nopv">${fileIcon(f, 'big')}<p>Preview isn't available for ${esc(typeName(f))} files.<br>Download the file to open it in its own app.</p></div>`;
  if (await ask({title: f.name, html: body, ok: 'Download', cancelText: 'Close', wide: true})) download(f);
}

/* ================= Commands ================= */
async function cmd(n, el) {
  const it = selItems(), f = it[0];
  switch (n) {
    case 'upload': return pick(el?.dataset.accept || '');
    case 'newfolder': {
      const v = await ask({title: 'New folder', input: 1, value: uniqueName('New folder', S.cwd), ok: 'Create'}); if (v == null) return;
      const nm = v.trim();
      if (!nm || /[\\/:*?"<>|]/.test(nm)) return toast('Invalid folder name');
      if (uniqueName(nm, S.cwd) !== nm) return toast('A folder with that name already exists');
      const now = Date.now(); await put({id: uid(), kind:'folder', parent: S.cwd, name: nm, size: 0, mime: '', created: now, modified: now, accessed: now, deleted: false, deletedAt: null, star: false});
      toast('Folder created'); return refresh();
    }
    case 'rename': return f && rename(f);
    case 'delete': return trashItems(it);
    case 'download': { const fl = it.filter(x => !isDir(x)); if (!fl.length) return toast('Folders can\'t be downloaded. Select a file.'); return fl.forEach(download); }
    case 'star': { const all = it.every(x => x.star); for (const x of it) { x.star = !all; await put(x); } toast(all ? 'Removed from starred' : 'Added to starred'); return refresh(); }
    case 'open': return f && openItem(f);
    case 'props': if (!f || isDir(f)) return toast('Select a file to see its properties'); localStorage.setItem('sel', f.id); location.href = 'storage.html'; return;
    case 'selectall': S.sel = new Set($$('.it').map(x => x.dataset.id)); return paintSel();
    case 'view': PREF.view = el.dataset.v; savePrefs(); return render();
    case 'pane': PREF.pane = !PREF.pane; savePrefs(); paintCmd(); return pane();
    case 'sortdir': S.sort.dir *= -1; if (S.page === 'explorer') { PREF.dir = S.sort.dir; savePrefs(); } return render();
    case 'starfilter': S.starOnly = !S.starOnly; return render();
    case 'up': { const c = S.map.get(S.cwd); if (c) goto(par(c)); return; }
    case 'refresh': return refresh();

const lbInfo = f => { $('#lbf').textContent = [f.w ? `${f.w} × ${f.h} px` : '', fmtSize(f.size), typeName(f), 'Modified ' + fmtDate(f.modified)].filter(Boolean).join('   |   '); };
function lbShow() {
  const f = LB.list[LB.i]; if (!f) return lbClose(); LB.z = 1; LB.r = 0;
  const im = $('#lbi'); im.onload = () => { if (!f.w && im.naturalWidth) { f.w = im.naturalWidth; f.h = im.naturalHeight; put(f); lbInfo(f); } };
  im.src = url(f); lbT(); $('#lbn').textContent = f.name; $('#lbc').textContent = `${LB.i + 1} of ${LB.list.length}`; lbInfo(f); f.accessed = Date.now(); put(f);
}
function lbClose() { clearInterval(LB.t); LB.t = null; $('#lb').hidden = true; document.body.classList.remove('lbo'); refresh(); }
async function lbCmd(c) {
  const n = LB.list.length, f = LB.list[LB.i];
  if (c === 'close') return lbClose();
  if (c === 'prev') { LB.i = (LB.i - 1 + n) % n; return lbShow(); }
  if (c === 'next') { LB.i = (LB.i + 1) % n; return lbShow(); }
  if (c === 'zoomin') LB.z = Math.min(4, LB.z + .25); else if (c === 'zoomout') LB.z = Math.max(.25, LB.z - .25);
  else if (c === 'reset') { LB.z = 1; LB.r = 0; } else if (c === 'rotate') LB.r += 90;
  else if (c === 'dl') return download(f);
  else if (c === 'del') { await trashItems([f]); LB.list.splice(LB.i, 1); if (!LB.list.length) return lbClose(); LB.i %= LB.list.length; return lbShow(); }
  else if (c === 'play') {
    if (LB.t) { clearInterval(LB.t); LB.t = null; } else LB.t = setInterval(() => lbCmd('next'), 3000);
    $('[data-lb=play]').innerHTML = ic(LB.t ? 'pause' : 'play'); return;
  }
  lbT();
}

/* ================= Intro page ================= */
const OBJ = [
  ['folder', 'File organization', 'Groups files into folders and paths so data is easy to find.', 'Example: This PC\\Documents\\report.pdf names the exact location of a file.', 'explorer.html', 'Create folders in File Explorer'],
  ['layers', 'Storage management', 'Tracks which disk blocks are free or used and allocates space to files.', 'Example: a 10 KB file needs three 4 KB blocks.', 'storage.html', 'See the disk allocation map'],
  ['search', 'File access', 'Lets programs read and write files by name, in order or directly.', 'Example: a video player jumps straight to minute 30 (direct access).', 'recent.html', 'See recently accessed files'],
  ['lock', 'Security', 'Permissions and ownership decide who can read, write or run a file.', 'Example: only the owner may edit a file; others can only read it.', 'documents.html', 'Browse documents by type'],
  ['shield', 'Reliability', 'Backups, journaling and error checks protect data after crashes.', 'Example: deleted files go to the Recycle Bin first, so mistakes can be undone.', 'trash.html', 'Try the Recycle Bin'],
  ['users', 'File sharing', 'Several users or programs can use the same file safely.', 'Example: two people open one report; locks stop their edits from clashing.', 'explorer.html', 'Organize and move files']
];
function intro() {
  const box = $('#obj'); if (!box) return; const seen = new Set();
  box.innerHTML = OBJ.map((o, i) => `<button class="obj" data-i="${i}">${ic(o[0])}<b>${o[1]}</b></button>`).join('');
  const show = i => {
    seen.add(i); $$('.obj').forEach(b => b.classList.toggle('on', +b.dataset.i === i)); const o = OBJ[i];
    $('#objinfo').innerHTML = `<h3>${o[1]}</h3><p>${o[2]}</p><p class="ex">${o[3]}</p><a class="btn primary" href="${o[4]}">${o[5]}${ic('arrowR')}</a>`;
    $('#pt').textContent = `${seen.size} of 6 explored`; $('#pb').style.width = seen.size / 6 * 100 + '%';
  };
  box.onclick = e => { const b = e.target.closest('.obj'); if (b) show(+b.dataset.i); }; show(0);
}

/* ================= Shell ================= */
function shell() {
  const main = $('main'); main.classList.add('col');
  const link = ([k, h, i, l]) => `<a href="${h}" class="${k === S.page ? 'active' : ''}" ${k === 'explorer' ? 'data-drop=""' : ''}>${ic(i)}<span>${l}</span>${k === 'trash' ? '<em id="bin-n" hidden></em>' : ''}</a>`;
  const groups = ['Learn', 'This PC', 'Manage'].map(g => `<div class="ng">${g}</div>${NAV.filter(n => n[4] === g).map(link).join('')}`).join('');
  const w = document.createElement('div'); w.className = 'win';
  w.innerHTML = `<header class="title"><button class="ib menu" id="menu" aria-label="Open navigation">${ic('menu')}</button><div class="app">${ic('drive')}<div><b>File System Explorer</b><small>Operating Systems practical</small></div></div><label class="gs">${ic('search')}<input id="q" type="search" placeholder="Search files and folders" aria-label="Search files and folders"></label><button class="btn primary" id="add" data-cmd="upload">${ic('upload')}<span>Add Files</span></button></header><div class="body"><aside class="nav">${groups}<div class="drive"><div class="dh">${ic('drive')}<div><b>Local Disk (C:)</b><small id="dm-t"></small></div></div><div class="bar"><i id="dm-b"></i></div></div></aside><div class="shade"></div></div>`;
  document.body.prepend(w); $('.body', w).insertBefore(main, $('.shade', w));
  document.body.insertAdjacentHTML('beforeend', `<dialog id="dlg"></dialog><div id="toast"></div><div id="ctx" hidden></div><div id="lb" hidden><div class="lbt"><div class="lbm"><b id="lbn"></b><small id="lbc"></small></div><div class="lbtools"><button data-lb="zoomout" aria-label="Zoom out" title="Zoom out">${ic('zoomout')}</button><button data-lb="zoomin" aria-label="Zoom in" title="Zoom in">${ic('zoomin')}</button><button data-lb="rotate" aria-label="Rotate" title="Rotate">${ic('refresh')}</button><button data-lb="reset" aria-label="Reset" title="Reset view">${ic('grid')}</button><button data-lb="play" aria-label="Slideshow" title="Slideshow">${ic('play')}</button><button data-lb="dl" aria-label="Download" title="Download">${ic('download')}</button><button data-lb="del" aria-label="Delete" title="Move to Recycle Bin">${ic('trash')}</button><button data-lb="close" aria-label="Close" title="Close (Esc)">${ic('x')}</button></div></div><button class="lbn prev" data-lb="prev" aria-label="Previous">${ic('chevL')}</button><div class="lbs"><img id="lbi" alt=""></div><button class="lbn next" data-lb="next" aria-label="Next">${ic('chevR')}</button><div class="lbf" id="lbf"></div></div>`);
  hydrate();
}

/* ================= Events ================= */
function bind() {
  document.addEventListener('click', e => {
    const t = e.target; if (!t.closest('#ctx')) hideMenu();
    const lb = t.closest('[data-lb]'); if (lb) return lbCmd(lb.dataset.lb);
    const ch = t.closest('[data-chip]'); if (ch) { S.chip = ch.dataset.chip; return render(); }
    const pf = t.closest('[data-pickfile]'); if (pf) { localStorage.setItem('sel', pf.dataset.pickfile); return render(); }
    const c = t.closest('[data-cmd]'); if (c) { hideMenu(); if (!c.disabled) cmd(c.dataset.cmd, c); return; }
    const ra = t.closest('[data-ra]'); if (ra) { S.sel = new Set([ra.closest('.it').dataset.id]); paintSel(); return cmd(ra.dataset.ra); }
    if (t.closest('#menu')) return document.body.classList.toggle('nav');
    if (t.closest('.shade')) return document.body.classList.remove('nav');
    const g = t.closest('[data-go]'); if (g) return goto(g.dataset.go || null);
    const th = t.closest('th[data-sort]'); if (th) { const k = th.dataset.sort; S.sort = S.sort.key === k ? {key: k, dir: -S.sort.dir} : {key: k, dir: 1}; if (S.page === 'explorer') { PREF.sort = S.sort.key; PREF.dir = S.sort.dir; savePrefs(); } return render(); }
    const it = t.closest('.it');
    if (it) {
      if (S.page === 'images') { if (t.closest('.chk')) { S.sel.has(it.dataset.id) ? S.sel.delete(it.dataset.id) : S.sel.add(it.dataset.id); return paintSel(); } const f = S.map.get(it.dataset.id); return openItem(f); }
      return selectEvt(e, it.dataset.id);
    }
    if (t.closest('.work') && !t.closest('.pane, .chips, .stats, .cmd') && S.sel.size) { S.sel.clear(); paintSel(); }
  });
  document.addEventListener('dblclick', e => { const it = e.target.closest('.it'); if (it && !['trash', 'images'].includes(S.page)) openItem(S.map.get(it.dataset.id)); });
  document.addEventListener('contextmenu', e => {
    if ($('#dlg').open || !$('#lb').hidden) return; const it = e.target.closest('.it');
    if (it) { e.preventDefault(); if (!S.sel.has(it.dataset.id)) { S.sel = new Set([it.dataset.id]); paintSel(); } return menu(e.clientX, e.clientY, itemMenu()); }
    if (S.page === 'explorer' && e.target.closest('.work')) { e.preventDefault(); menu(e.clientX, e.clientY, [['New folder', 'newfolder', 'folderplus'], ['Upload files', 'upload', 'upload'], '-', ['Select all', 'selectall', 'check'], ['Refresh', 'refresh', 'refresh']]); }
  });
  document.addEventListener('keydown', e => {
    if (!$('#lb').hidden) { const k = {Escape: 'close', ArrowLeft: 'prev', ArrowRight: 'next', '+': 'zoomin', '-': 'zoomout'}[e.key]; if (k) { e.preventDefault(); lbCmd(k); } return; }
    if (e.key === 'Escape') { hideMenu(); if (S.sel.size) { S.sel.clear(); paintSel(); } return; }
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || $('#dlg').open) return;
    const ed = ['explorer', 'recent', 'documents', 'images'].includes(S.page);
    if (e.key === 'F2' && ed && S.sel.size === 1) { e.preventDefault(); cmd('rename'); }
    else if (e.key === 'Delete' && S.sel.size) cmd(S.page === 'trash' ? 'purge' : 'delete');
    else if (e.key === 'Enter' && S.sel.size === 1 && S.page !== 'trash') cmd('open');
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a' && $$('.it').length) { e.preventDefault(); cmd('selectall'); }
    else if (e.key === 'Backspace' && S.page === 'explorer' && S.cwd) { e.preventDefault(); cmd('up'); }
  });
  /* search */
  const q = $('#q'), iq = new URLSearchParams(location.search).get('q'); if (iq) { q.value = iq; S.q = iq.toLowerCase(); }
  q.addEventListener('input', () => { S.q = q.value.trim().toLowerCase(); if (SEARCHABLE.includes(S.page)) { S.sel.clear(); render(); } });
  q.addEventListener('keydown', e => { if (e.key === 'Enter' && !SEARCHABLE.includes(S.page)) location.href = 'explorer.html?q=' + encodeURIComponent(q.value.trim()); });
  /* controls */
  $('#sortsel')?.addEventListener('change', e => { S.sort.key = e.target.value; if (S.page === 'explorer') { PREF.sort = S.sort.key; savePrefs(); } render(); });
  $('#groupsel')?.addEventListener('change', e => { PREF.group = e.target.value; savePrefs(); render(); });
  $('#tsz')?.addEventListener('input', e => { PREF.gal = +e.target.value; savePrefs(); $('#gal').style.setProperty('--ts', PREF.gal + 'px'); });
  $('#fsel')?.addEventListener('change', e => { localStorage.setItem('sel', e.target.value); render(); });
  $('#lb')?.addEventListener('wheel', e => { e.preventDefault(); lbCmd(e.deltaY < 0 ? 'zoomin' : 'zoomout'); }, {passive: false});
  /* drag & drop: move items between folders, or drop files from the computer */
  let dc = 0; const clearDrag = () => { dc = 0; document.body.classList.remove('drag'); $$('.dropt').forEach(x => x.classList.remove('dropt')); };
  const extFiles = dt => [...(dt.items || [])].filter(i => i.kind === 'file' && !(i.webkitGetAsEntry && i.webkitGetAsEntry()?.isDirectory)).map(i => i.getAsFile()).filter(Boolean);
  addEventListener('dragstart', e => { const it = e.target.closest?.('.it'); if (!it || S.page !== 'explorer') return; if (!S.sel.has(it.dataset.id)) { S.sel = new Set([it.dataset.id]); paintSel(); } e.dataTransfer.setData('text/fsid', JSON.stringify([...S.sel])); e.dataTransfer.effectAllowed = 'move'; });
  addEventListener('dragenter', e => { if ([...(e.dataTransfer.types || [])].includes('Files')) { dc++; document.body.classList.add('drag'); } });
  addEventListener('dragleave', () => { if (--dc <= 0) clearDrag(); });
  addEventListener('dragover', e => { e.preventDefault(); $$('.dropt').forEach(x => x.classList.remove('dropt')); e.target.closest?.('[data-dir],[data-drop]')?.classList.add('dropt'); });
  addEventListener('dragend', clearDrag);
  addEventListener('drop', e => {
    e.preventDefault(); const tg = e.target.closest?.('[data-dir],[data-drop]'); clearDrag();
    const target = tg ? (tg.dataset.drop !== undefined ? (tg.dataset.drop || null) : tg.dataset.id) : undefined, raw = e.dataTransfer.getData('text/fsid');
    if (raw) return tg ? moveTo(JSON.parse(raw), target) : undefined;
    const fl = extFiles(e.dataTransfer); if (fl.length) addFiles(fl, target);
  });
}

(async () => {
  shell(); bind(); intro();
  try { await openDB(); await refresh(); }
  catch (err) { console.error(err); toast('Browser storage is unavailable. Open the site with VS Code Live Server.'); }
})();

</script>
